name: doctrine-elite7b:latest
version: 1.6.0
schema: v1

models:
  - name: doctrine-elite7b:latest  
    provider: ollama
    model: doctrine-elite7b:latest
    baseURL: "http://127.0.0.1:11434"
    
    # Request options - ONLY target reasoning tokens
    requestOptions:
      temperature: 0.3
      stop: ["<｜end▁of▁thinking｜>", "<｜end▁of▁thinking｜>"]
    
    editor:
      enabled: true
      features:
        inline_completion: true
        code_lens: true
        diagnostics: true
        formatting: true
      
      autocomplete:
        enabled: true
        trigger_characters: true
        debounce_ms: 3000
        max_items: 5
        
      edit:
        accept_changes: "diff"
        show_preview: true
        
      review:
        inline_comments: true
        suggest_fixes: true
        severity_levels:
          error: "high"
          warning: "medium"
          suggestion: "low"
    
    context:
      max_file_size: 100000
      max_files: 10
      include:
        - current_file
        - opened_files
        - project_structure
        - git_diff